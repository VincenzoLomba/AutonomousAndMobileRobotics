
# OLD AND UN UN-USED FILE

explore_node:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.15
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.5
    # Minimum absolute rotation angle (radians) required to trigger the pre-rotation Spin.
    # Applied symmetrically. Default: ~10 degrees (0.1745 rad).
    min_prerotation_angle: 0.1745
    # Post-spin heading recheck tolerance. See params.yaml for full description.
    post_spin_heading_tolerance: 0.3490
    # Maximum spin attempts per pre-rotation sequence. 1 = current behavior (no recheck).
    max_spin_retries: 1
